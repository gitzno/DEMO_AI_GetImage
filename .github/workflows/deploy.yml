name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ] # Trigger khi bạn push lên nhánh main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Login Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 2. Build và Push Image (Docker Compose tự build theo service trong file)
      - name: Build and push via Docker Compose
        run: |
          docker-compose -f docker-compose.yml build
          docker tag shoesize_api:latest ${{ secrets.DOCKER_USER }}/shoesize-api:latest
          docker tag shoesize_frontend:latest ${{ secrets.DOCKER_USER }}/shoesize-frontend:latest
          docker push ${{ secrets.DOCKER_USER }}/shoesize-api:latest
          docker push ${{ secrets.DOCKER_USER }}/shoesize-frontend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # Pull image mới về
            docker pull ${{ secrets.DOCKER_USER }}/shoesize-api:latest
            docker pull ${{ secrets.DOCKER_USER }}/shoesize-frontend:latest
            # Chạy lại hệ thống
            cd /path/to/your/project
      - name: Build and push via Docker Compose
        run: |
          docker compose -f docker-compose.yml build
          docker tag shoesize_api:latest ${{ secrets.DOCKER_USER }}/shoesize-api:latest
          docker tag shoesize_frontend:latest ${{ secrets.DOCKER_USER }}/shoesize-frontend:latest
          docker push ${{ secrets.DOCKER_USER }}/shoesize-api:latest
          docker push ${{ secrets.DOCKER_USER }}/shoesize-frontend:latest